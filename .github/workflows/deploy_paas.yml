name: Zero-Docker PaaS Deployment Pipeline

on:
  push:
    branches: [ main, staging ]

jobs:
  # =========================================================
  # Job 1: Lint & Verify Backend API
  # =========================================================
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r backend/requirements.txt

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # =========================================================
  # Job 2: Lint & Build Frontend React SPA
  # =========================================================
  verify-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --silent

      - name: Verify production build compilation
        run: |
          cd frontend
          npm run build

  # =========================================================
  # Job 3: Automated Deploy to Vercel & Render
  # =========================================================
  deploy:
    needs: [verify-backend, verify-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # --- Frontend Deploy to Vercel ---
      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
          alias-domains: |
            newshub-live.vercel.app

      # --- Backend Deploy to Render ---
      - name: Trigger Render Deploy Webhook
        if: success()
        run: |
          curl -f -X GET "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
